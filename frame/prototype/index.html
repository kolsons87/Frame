/* App-only shell: no intro text, no phone frame, no simulated status bar.
   Phones (<700px) already get this from ios.css; these rules apply the same
   full-screen layout at every width. On wide screens the app stays a
   phone-width column centred on the ivory background. */
body {
  background: var(--bg);
}
.studio {
  display: block;
  padding: 0;
  min-height: 100dvh;
}
.device {
  width: 100%;
  max-width: 520px;
  height: 100dvh;
  min-height: 0;
  margin: 0 auto;
  border: 0;
  border-radius: 0;
  box-shadow: none;
}
.shell {
  height: 100%;
}
.topbar {
  padding-top: max(12px, env(safe-area-inset-top));
  height: 70px;
}
.sidebar {
  height: calc(76px + env(safe-area-inset-bottom)) !important;
  padding-bottom: max(18px, env(safe-area-inset-bottom)) !important;
}
.toast {
  bottom: calc(95px + env(safe-area-inset-bottom));
}
@media (min-width: 521px) {
  /* A quiet edge so the column reads as the app, not a stretched page. */
  .device {
    border-left: 1px solid #e5e4df;
    border-right: 1px solid #e5e4df;
  }
}
